<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="72%" cy="34%" r="60%">
      <stop offset="0%" stop-color="#2b3a4f"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </radialGradient>
    <linearGradient id="onTrack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f9dde"/>
      <stop offset="100%" stop-color="#63e6be"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Toggle stack: the central metaphor -->
  <g transform="translate(720, 150)">
    <!-- ON toggle (active flag) -->
    <g>
      <rect x="0" y="0" width="150" height="66" rx="33" fill="url(#onTrack)"/>
      <circle cx="117" cy="33" r="24" fill="#faf9f6"/>
    </g>

    <!-- ON toggle -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="150" height="66" rx="33" fill="url(#onTrack)"/>
      <circle cx="117" cy="33" r="24" fill="#faf9f6"/>
    </g>

    <!-- OFF toggle (dead flag / debt) -->
    <g transform="translate(0, 200)" opacity="0.4">
      <rect x="0" y="0" width="150" height="66" rx="33" fill="none" stroke="#7c8aa0" stroke-width="2" stroke-dasharray="6 7"/>
      <circle cx="33" cy="33" r="24" fill="none" stroke="#7c8aa0" stroke-width="2"/>
    </g>

    <!-- OFF toggle (dead flag / debt) -->
    <g transform="translate(0, 300)" opacity="0.4">
      <rect x="0" y="0" width="150" height="66" rx="33" fill="none" stroke="#7c8aa0" stroke-width="2" stroke-dasharray="6 7"/>
      <circle cx="33" cy="33" r="24" fill="none" stroke="#7c8aa0" stroke-width="2"/>
    </g>
  </g>

  <!-- Title -->
  <g fill="#faf9f6" font-family="Inter, -apple-system, sans-serif" font-weight="700">
    <text x="80" y="250" font-size="72" letter-spacing="-2">Feature Flags</text>
    <text x="80" y="330" font-size="72" letter-spacing="-2">in React</text>
  </g>

  <text x="80" y="410" fill="#63e6be" font-family="Inter, -apple-system, sans-serif" font-weight="600" font-size="27" letter-spacing="0.5">Architecture patterns, without the flag debt</text>

  <!-- accent underline -->
  <rect x="80" y="440" width="88" height="5" rx="2.5" fill="#4f9dde"/>
</svg>
