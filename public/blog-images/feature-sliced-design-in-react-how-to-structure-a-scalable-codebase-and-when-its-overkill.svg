<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="72%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#1f2a44"/>
      <stop offset="100%" stop-color="#161622"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2555a"/>
    </marker>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 H0 V34" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Layer stack -->
  <g transform="translate(760, 150)">
    <!-- rows -->
    <g font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="600" letter-spacing="0.4">
      <rect x="0"  y="0"   width="300" height="42" rx="6" fill="#f2555a" fill-opacity="0.16" stroke="#f2555a" stroke-opacity="0.55"/>
      <text x="20" y="27" fill="#f2f2f5">App</text>

      <rect x="0"  y="54"  width="300" height="42" rx="6" fill="#f2555a" fill-opacity="0.13" stroke="#f2555a" stroke-opacity="0.45"/>
      <text x="20" y="81" fill="#f2f2f5">Pages</text>

      <rect x="0"  y="108" width="300" height="42" rx="6" fill="#f2555a" fill-opacity="0.11" stroke="#f2555a" stroke-opacity="0.38"/>
      <text x="20" y="135" fill="#f2f2f5">Widgets</text>

      <rect x="0"  y="162" width="300" height="42" rx="6" fill="#f2555a" fill-opacity="0.09" stroke="#f2555a" stroke-opacity="0.32"/>
      <text x="20" y="189" fill="#f2f2f5">Features</text>

      <rect x="0"  y="216" width="300" height="42" rx="6" fill="#f2555a" fill-opacity="0.07" stroke="#f2555a" stroke-opacity="0.26"/>
      <text x="20" y="243" fill="#f2f2f5">Entities</text>

      <rect x="0"  y="270" width="300" height="42" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.22"/>
      <text x="20" y="297" fill="#cfd0d8">Shared</text>
    </g>

    <!-- one-way import arrow, top to bottom -->
    <line x1="330" y1="14" x2="330" y2="300" stroke="#f2555a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="346" y="160" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500"
          fill="#f2555a" transform="rotate(90 346 160)" text-anchor="middle" letter-spacing="1">imports downward only</text>
  </g>

  <!-- Title -->
  <g font-family="Inter, -apple-system, sans-serif" fill="#f2f2f5">
    <text x="80" y="220" font-size="62" font-weight="800" letter-spacing="-1">Feature-Sliced</text>
    <text x="80" y="288" font-size="62" font-weight="800" letter-spacing="-1">Design</text>
    <text x="80" y="360" font-size="24" font-weight="400" fill="#9a9ba6">Six layers, one import rule,</text>
    <text x="80" y="392" font-size="24" font-weight="400" fill="#9a9ba6">and when it's overkill.</text>
  </g>
</svg>
