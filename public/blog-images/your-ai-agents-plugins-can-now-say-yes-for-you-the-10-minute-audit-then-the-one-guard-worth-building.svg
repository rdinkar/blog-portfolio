<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.72" r="0.45">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#1a1a2e"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Title -->
  <g font-family="Inter, -apple-system, sans-serif" fill="#f4f1ea">
    <text x="80" y="150" font-size="62" font-weight="700" letter-spacing="-1.5">Your AI agent's plugins</text>
    <text x="80" y="226" font-size="62" font-weight="700" letter-spacing="-1.5">can now say <tspan fill="#f5a524">“yes”</tspan> for you</text>
    <text x="80" y="282" font-size="24" font-weight="400" fill="#9a98a8">The 10-minute audit, then the one guard worth building</text>
  </g>

  <!-- Permission path: tool call -> ask rule -> hook -> (blocked) ; mod arcs over to yes -->
  <g font-family="Inter, -apple-system, sans-serif" font-size="18" fill="#9a98a8">
    <!-- origin -->
    <circle cx="120" cy="470" r="9" fill="#f4f1ea"/>
    <text x="120" y="512" text-anchor="middle">tool call</text>

    <!-- main path -->
    <line x1="132" y1="470" x2="690" y2="470" stroke="#5c5a6e" stroke-width="3"/>
    <line x1="700" y1="470" x2="930" y2="470" stroke="#5c5a6e" stroke-width="3" stroke-dasharray="6 10"/>

    <!-- gate 1: ask rule -->
    <rect x="360" y="420" width="10" height="100" rx="3" fill="#f4f1ea" fill-opacity="0.85"/>
    <text x="365" y="550" text-anchor="middle">ask rule</text>

    <!-- gate 2: hook -->
    <rect x="560" y="420" width="10" height="100" rx="3" fill="#f4f1ea" fill-opacity="0.85"/>
    <text x="565" y="550" text-anchor="middle">hook</text>

    <!-- blocked marker -->
    <g stroke="#5c5a6e" stroke-width="3" stroke-linecap="round">
      <line x1="684" y1="458" x2="708" y2="482"/>
      <line x1="708" y1="458" x2="684" y2="482"/>
    </g>

    <!-- mod: last word, arcs over both gates -->
    <circle cx="640" cy="372" r="22" fill="none" stroke="#f5a524" stroke-width="3"/>
    <text x="640" y="378" text-anchor="middle" font-size="16" font-weight="600" fill="#f5a524">mod</text>
    <path d="M 618 372 C 520 372, 500 470, 470 470" fill="none" stroke="#f5a524" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="3 6"/>
    <path d="M 662 372 C 820 372, 900 470, 1010 470" fill="none" stroke="#f5a524" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 996 460 L 1012 470 L 996 480" fill="none" stroke="#f5a524" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- approved -->
    <circle cx="1060" cy="470" r="36" fill="#f5a524"/>
    <path d="M 1043 471 L 1055 483 L 1078 458" fill="none" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1060" y="535" text-anchor="middle" fill="#f5a524" font-weight="600">approved</text>
  </g>
</svg>
