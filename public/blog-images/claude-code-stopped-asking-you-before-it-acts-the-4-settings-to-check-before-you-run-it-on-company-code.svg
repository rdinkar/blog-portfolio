<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#f5a524" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#1a1a2e"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Title -->
  <g font-family="Inter, -apple-system, sans-serif" fill="#f4f1ea">
    <text x="80" y="220" font-size="52" font-weight="700" letter-spacing="-1">Claude Code stopped</text>
    <text x="80" y="284" font-size="52" font-weight="700" letter-spacing="-1">asking before it acts.</text>
    <rect x="80" y="330" width="56" height="4" rx="2" fill="#f5a524"/>
    <text x="80" y="392" font-size="30" font-weight="500" fill="#f5a524">4 settings to check first</text>
  </g>

  <!-- Incoming action flowing into the settings panel -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="80" y="520" font-size="20" fill="#f4f1ea" fill-opacity="0.45">$ git push origin main</text>
    <path d="M 330 513 L 690 513 L 690 335 L 730 335" fill="none" stroke="#f4f1ea" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M 722 329 L 732 335 L 722 341" fill="none" stroke="#f4f1ea" stroke-opacity="0.4" stroke-width="2"/>
  </g>

  <!-- Settings panel -->
  <rect x="740" y="130" width="380" height="410" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#f4f1ea" stroke-opacity="0.15" stroke-width="1.5"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#f4f1ea">
    <!-- Row 1 -->
    <text x="775" y="212" fill-opacity="0.85">defaultMode</text>
    <rect x="1020" y="192" width="64" height="30" rx="15" fill="#f5a524"/>
    <circle cx="1069" cy="207" r="11" fill="#1a1a2e"/>
    <line x1="775" y1="245" x2="1085" y2="245" stroke="#f4f1ea" stroke-opacity="0.08"/>

    <!-- Row 2 -->
    <text x="775" y="302" fill-opacity="0.85">ask: git push</text>
    <rect x="1020" y="282" width="64" height="30" rx="15" fill="#f5a524"/>
    <circle cx="1069" cy="297" r="11" fill="#1a1a2e"/>
    <line x1="775" y1="335" x2="1085" y2="335" stroke="#f4f1ea" stroke-opacity="0.08"/>

    <!-- Row 3 -->
    <text x="775" y="392" fill-opacity="0.85">environment</text>
    <rect x="1020" y="372" width="64" height="30" rx="15" fill="#f5a524"/>
    <circle cx="1069" cy="387" r="11" fill="#1a1a2e"/>
    <line x1="775" y1="425" x2="1085" y2="425" stroke="#f4f1ea" stroke-opacity="0.08"/>

    <!-- Row 4: not yet enabled -->
    <text x="775" y="482" fill-opacity="0.85">sandbox</text>
    <rect x="1020" y="462" width="64" height="30" rx="15" fill="none" stroke="#f4f1ea" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="1035" cy="477" r="10" fill="#f4f1ea" fill-opacity="0.35"/>
  </g>
</svg>
