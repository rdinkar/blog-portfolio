<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="72%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#1f2a3d"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a2a44" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f3550" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#2f3550" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2f3550" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <!-- The full list: many ghosted rows, tall column on the right -->
  <g transform="translate(760, 70)">
    <!-- full-height spacer track -->
    <rect x="0" y="0" width="300" height="490" rx="10" fill="url(#fade)"/>

    <!-- ghosted (unrendered) rows -->
    <g fill="#3a4160" opacity="0.5">
      <rect x="22" y="20"  width="256" height="18" rx="4"/>
      <rect x="22" y="48"  width="210" height="18" rx="4"/>
      <rect x="22" y="76"  width="240" height="18" rx="4"/>
      <rect x="22" y="104" width="190" height="18" rx="4"/>
      <rect x="22" y="132" width="256" height="18" rx="4"/>
    </g>

    <!-- the rendered window: only these rows exist in the DOM -->
    <rect x="8" y="168" width="284" height="158" rx="12" fill="#242b42" stroke="#4f8cff" stroke-width="2.5"/>
    <g>
      <rect x="22" y="184" width="256" height="20" rx="4" fill="#4f8cff"/>
      <rect x="22" y="216" width="220" height="20" rx="4" fill="#7fb0ff"/>
      <rect x="22" y="248" width="256" height="20" rx="4" fill="#4f8cff"/>
      <rect x="22" y="280" width="200" height="20" rx="4" fill="#7fb0ff"/>
    </g>

    <!-- ghosted rows below -->
    <g fill="#3a4160" opacity="0.5">
      <rect x="22" y="352" width="240" height="18" rx="4"/>
      <rect x="22" y="380" width="256" height="18" rx="4"/>
      <rect x="22" y="408" width="200" height="18" rx="4"/>
      <rect x="22" y="436" width="248" height="18" rx="4"/>
      <rect x="22" y="464" width="216" height="18" rx="4"/>
    </g>

    <!-- viewport bracket label -->
    <text x="300" y="252" fill="#7fb0ff" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="start" transform="translate(18,0)">viewport</text>
    <line x1="300" y1="168" x2="316" y2="168" stroke="#4f8cff" stroke-width="2"/>
    <line x1="316" y1="168" x2="316" y2="326" stroke="#4f8cff" stroke-width="2"/>
    <line x1="300" y1="326" x2="316" y2="326" stroke="#4f8cff" stroke-width="2"/>
  </g>

  <!-- Title -->
  <text x="80" y="220" fill="#f4f5fb" font-family="Inter, -apple-system, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5">List</text>
  <text x="80" y="292" fill="#f4f5fb" font-family="Inter, -apple-system, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5">Virtualization</text>
  <text x="80" y="364" fill="#4f8cff" font-family="Inter, -apple-system, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5">from scratch</text>

  <text x="82" y="430" fill="#9aa3c0" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="500">Render what fits. Fake the rest.</text>
</svg>
