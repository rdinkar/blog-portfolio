<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#1f2547"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4a261" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#f4a261"/>
      <stop offset="100%" stop-color="#f4a261" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- central visual: an exact instant on the timeline vs the wall-clock ring around it -->
  <g transform="translate(600 232)">
    <!-- timeline: the exact point -->
    <line x1="-360" y1="0" x2="360" y2="0" stroke="url(#line)" stroke-width="2"/>
    <g stroke="#f4a261" stroke-opacity="0.4" stroke-width="1.5">
      <line x1="-300" y1="-6" x2="-300" y2="6"/>
      <line x1="-180" y1="-6" x2="-180" y2="6"/>
      <line x1="180" y1="-6" x2="180" y2="6"/>
      <line x1="300" y1="-6" x2="300" y2="6"/>
    </g>

    <!-- wall-clock ring -->
    <circle cx="0" cy="0" r="92" fill="none" stroke="#6c7ae0" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#6c7ae0" stroke-width="3" stroke-dasharray="4 500" stroke-dashoffset="-40"/>

    <!-- clock hands -->
    <line x1="0" y1="0" x2="0" y2="-56" stroke="#e6e6f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="42" y2="24" stroke="#e6e6f0" stroke-width="4" stroke-linecap="round"/>

    <!-- the exact instant node -->
    <circle cx="0" cy="0" r="10" fill="#f4a261"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#f4a261" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>

  <!-- title -->
  <g font-family="Inter, -apple-system, sans-serif" fill="#f5f5f7">
    <text x="600" y="430" text-anchor="middle" font-size="62" font-weight="700" letter-spacing="-1.5">The Temporal API</text>
    <text x="600" y="500" text-anchor="middle" font-size="34" font-weight="400" fill="#a9adc4" letter-spacing="-0.3">A modern replacement for JavaScript Date</text>
  </g>

  <!-- concept labels -->
  <g font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="500" letter-spacing="0.5">
    <text x="240" y="232" text-anchor="end" fill="#f4a261" opacity="0.85">exact instant</text>
    <text x="600" y="120" text-anchor="middle" fill="#6c7ae0" opacity="0.85">wall-clock time</text>
  </g>
</svg>
