<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="72%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#2f2f3a"/>
      <stop offset="100%" stop-color="#242424"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c9cff"/>
      <stop offset="100%" stop-color="#5b7cff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- subtle grid texture -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- The native select control + open picker panel -->
  <g transform="translate(760, 150)">
    <!-- closed control (the button) -->
    <rect x="0" y="0" width="330" height="64" rx="12" fill="#2b2b34" stroke="#3d3d48" stroke-width="1.5"/>
    <circle cx="34" cy="32" r="10" fill="url(#accent)"/>
    <text x="60" y="41" font-family="Inter, -apple-system, sans-serif" font-size="22" fill="#e8e8ea">India</text>
    <!-- picker-icon, rotated open -->
    <path d="M292 27 l10 10 l10 -10" fill="none" stroke="#8a8a94" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 302 32)"/>

    <!-- the ::picker(select) panel, promoted to top layer -->
    <rect x="0" y="82" width="330" height="252" rx="14" fill="#ffffff"/>
    <rect x="0" y="82" width="330" height="252" rx="14" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.5"/>

    <!-- option rows -->
    <g font-family="Inter, -apple-system, sans-serif" font-size="21">
      <!-- checked row -->
      <rect x="10" y="94" width="310" height="52" rx="9" fill="#eef1ff"/>
      <circle cx="42" cy="120" r="10" fill="url(#accent)"/>
      <text x="66" y="128" fill="#1a1a2e" font-weight="600">India</text>
      <path d="M282 114 l7 8 l14 -16" fill="none" stroke="#5b7cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <circle cx="42" cy="176" r="10" fill="#e34a3c"/>
      <text x="66" y="184" fill="#33333a">Japan</text>

      <circle cx="42" cy="232" r="10" fill="#2fa36b"/>
      <text x="66" y="240" fill="#33333a">Brazil</text>

      <circle cx="42" cy="288" r="10" fill="#e8a13c"/>
      <text x="66" y="296" fill="#33333a">Kenya</text>
    </g>
  </g>

  <!-- Title -->
  <g font-family="Inter, -apple-system, sans-serif">
    <text x="80" y="212" font-size="30" fill="#7c9cff" font-weight="600" letter-spacing="2">appearance: base-select</text>
    <text x="80" y="300" font-size="62" fill="#f5f5f6" font-weight="700">The real native</text>
    <text x="80" y="372" font-size="62" fill="#f5f5f6" font-weight="700">select, finally</text>
    <text x="80" y="444" font-size="62" fill="#f5f5f6" font-weight="700">styleable.</text>
    <text x="80" y="512" font-size="24" fill="#9a9aa2" font-weight="400">Drop react-select. Style the box you click.</text>
  </g>
</svg>
