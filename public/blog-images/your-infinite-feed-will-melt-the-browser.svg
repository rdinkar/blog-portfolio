<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <radialGradient id="glow" cx="72%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#2f3a3a"/>
      <stop offset="100%" stop-color="#242424"/>
    </radialGradient>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242424" stop-opacity="1"/>
      <stop offset="100%" stop-color="#242424" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242424" stop-opacity="0"/>
      <stop offset="100%" stop-color="#242424" stop-opacity="1"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <clipPath id="feedClip">
      <rect x="720" y="70" width="330" height="490" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="222" fill="#f5f4f0" font-size="60" font-weight="800" letter-spacing="-1.5">Your infinite</text>
  <text x="80" y="292" fill="#f5f4f0" font-size="60" font-weight="800" letter-spacing="-1.5">feed will melt</text>
  <text x="80" y="362" fill="#5eead4" font-size="60" font-weight="800" letter-spacing="-1.5">the browser</text>

  <text x="82" y="428" fill="#a7a7a2" font-size="24" font-weight="500" letter-spacing="0.2">Cursor pagination. List virtualization.</text>
  <text x="82" y="462" fill="#a7a7a2" font-size="24" font-weight="500" letter-spacing="0.2">A feed that holds memory flat.</text>

  <!-- Feed viewport -->
  <g clip-path="url(#feedClip)">
    <!-- ghost rows above (recycled) -->
    <g fill="none" stroke="#5eead4" stroke-opacity="0.35" stroke-dasharray="4 5">
      <rect x="744" y="-6" width="282" height="70" rx="12"/>
      <rect x="744" y="72" width="282" height="70" rx="12"/>
    </g>

    <!-- rendered window: solid cards -->
    <g>
      <g>
        <rect x="744" y="158" width="282" height="82" rx="12" fill="#2c2c2c" stroke="#3a3a3a"/>
        <circle cx="770" cy="184" r="12" fill="#5eead4"/>
        <rect x="792" y="176" width="120" height="8" rx="4" fill="#4a4a4a"/>
        <rect x="792" y="192" width="70" height="7" rx="3.5" fill="#3d3d3d"/>
        <rect x="756" y="214" width="258" height="10" rx="5" fill="#353535"/>
      </g>
      <g>
        <rect x="744" y="252" width="282" height="82" rx="12" fill="#2c2c2c" stroke="#3a3a3a"/>
        <circle cx="770" cy="278" r="12" fill="#fbbf77"/>
        <rect x="792" y="270" width="100" height="8" rx="4" fill="#4a4a4a"/>
        <rect x="792" y="286" width="60" height="7" rx="3.5" fill="#3d3d3d"/>
        <rect x="756" y="308" width="230" height="10" rx="5" fill="#353535"/>
      </g>
      <g>
        <rect x="744" y="346" width="282" height="82" rx="12" fill="#2c2c2c" stroke="#3a3a3a"/>
        <circle cx="770" cy="372" r="12" fill="#5eead4"/>
        <rect x="792" y="364" width="130" height="8" rx="4" fill="#4a4a4a"/>
        <rect x="792" y="380" width="80" height="7" rx="3.5" fill="#3d3d3d"/>
        <rect x="756" y="402" width="258" height="10" rx="5" fill="#353535"/>
      </g>
    </g>

    <!-- ghost rows below (not yet fetched) -->
    <g fill="none" stroke="#5eead4" stroke-opacity="0.35" stroke-dasharray="4 5">
      <rect x="744" y="440" width="282" height="70" rx="12"/>
      <rect x="744" y="518" width="282" height="70" rx="12"/>
    </g>

    <!-- fade overlays for the endless illusion -->
    <rect x="720" y="70" width="330" height="90" fill="url(#fadeTop)"/>
    <rect x="720" y="470" width="330" height="90" fill="url(#fadeBottom)"/>
  </g>

  <!-- viewport frame -->
  <rect x="720" y="70" width="330" height="490" rx="18" fill="none" stroke="#4d4d4d" stroke-width="1.5"/>

  <!-- scrollbar track showing large total height -->
  <rect x="1064" y="70" width="6" height="490" rx="3" fill="#333333"/>
  <rect x="1064" y="196" width="6" height="150" rx="3" fill="#5eead4" fill-opacity="0.85"/>

  <!-- window highlight bracket on the rendered slice -->
  <path d="M708 152 h-14 v130 h14" fill="none" stroke="#5eead4" stroke-width="2" stroke-opacity="0.8"/>
  <text x="614" y="221" fill="#5eead4" font-size="14" font-weight="600" text-anchor="middle" transform="rotate(-90 614 221)">rendered window</text>
</svg>
